<header class="header">
  <div class="container header__inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand__mark"><app-icon name="paw-print" [size]="20" /></span>
      <span class="brand__name">Добрые лапки</span>
    </a>

    <nav class="nav" [class.nav--open]="menuOpen()" aria-label="Основная навигация">
      <a
        class="nav__link"
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
        >Главная</a
      >
      <a class="nav__link" routerLink="/animals" routerLinkActive="nav__link--active" (click)="closeMenu()"
        >Животные</a
      >
      <a class="nav__link" routerLink="/about" routerLinkActive="nav__link--active" (click)="closeMenu()"
        >О нас</a
      >
      <a class="nav__link" routerLink="/contacts" routerLinkActive="nav__link--active" (click)="closeMenu()"
        >Контакты</a
      >
    </nav>

    <div class="actions">
      <button
        type="button"
        class="icon-btn"
        [attr.aria-expanded]="searchOpen()"
        aria-label="Поиск животных"
        (click)="toggleSearch()"
      >
        <app-icon name="search" [size]="20" />
      </button>

      <a class="icon-btn" routerLink="/favorites" aria-label="Избранное">
        <app-icon name="heart" [size]="20" />
        @if (favoritesCount() > 0) {
          <span class="icon-btn__count">{{ favoritesCount() }}</span>
        }
      </a>

      @if (user(); as currentUser) {
        <a class="avatar" routerLink="/profile" [attr.aria-label]="'Профиль ' + currentUser.name">
          <img [src]="currentUser.avatar" [alt]="currentUser.name" appImgFallback />
        </a>
      } @else {
        <a class="icon-btn" routerLink="/login" aria-label="Войти">
          <app-icon name="user" [size]="20" />
        </a>
      }

      <button
        type="button"
        class="icon-btn burger"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Открыть меню"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="22" />
      </button>
    </div>
  </div>

  @if (searchOpen()) {
    <div class="search-bar">
      <div class="container search-bar__inner">
        <span class="search-bar__icon"><app-icon name="search" [size]="18" /></span>
        <input
          class="search-bar__input"
          type="search"
          placeholder="Введите кличку или породу…"
          aria-label="Поиск животных по кличке или породе"
          [value]="query()"
          (input)="onQuery($event)"
          (keydown.enter)="submitSearch()"
        />
        <button type="button" class="btn btn--primary btn--sm" (click)="submitSearch()">Найти</button>
      </div>
    </div>
  }
</header>
